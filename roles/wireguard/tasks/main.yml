---
# role: wireguard
# TODO: implementar no fim de semana 4, depois de validar tudo manualmente.
- name: Diretorio do WireGuard
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    mode: '0700'

- name: Gerar chave privada do servidor
  ansible.builtin.shell: |
    set -o pipefail
    umask 077 && wg genkey > /etc/wireguard/server.key
  args:
    executable: /bin/bash
    creates: /etc/wireguard/server.key

- name: Derivar chave publica do servidor
  ansible.builtin.shell: |
    set -o pipefail
    wg pubkey < /etc/wireguard/server.key > /etc/wireguard/server.pub
  args:
    executable: /bin/bash
    creates: /etc/wireguard/server.pub

- name: Ler chave privada do servidor
  ansible.builtin.slurp:
    src: /etc/wireguard/server.key
  register: wireguard_wg_server_key
  no_log: true

- name: Configurar wg0
  ansible.builtin.copy:
    dest: /etc/wireguard/wg0.conf
    mode: '0600'
    content: |
      [Interface]
      Address = {{ wg_server_address }}
      ListenPort = {{ wg_port }}
      PrivateKey = {{ wireguard_wg_server_key.content | b64decode | trim }}
      {% for peer in wg_peers %}

      [Peer]
      # {{ peer.name }}
      PublicKey = {{ peer.public_key }}
      AllowedIPs = {{ peer.allowed_ips }}
      {% endfor %}
  notify: Restart wireguard
  no_log: true

- name: Habilitar wg-quick
  ansible.builtin.systemd:
    name: "wg-quick@{{ wg_interface }}"
    enabled: true
    state: started
