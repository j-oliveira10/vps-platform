name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ansible-lint
        uses: ansible/ansible-lint@main

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar arquivos compose
        run: |
          cp .env.example .env
          for f in compose/*/docker-compose.yml; do
            echo "== $f"
            docker compose -f "$f" --env-file .env config -q
          done
