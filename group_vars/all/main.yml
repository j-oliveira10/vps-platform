---
# Variáveis não sensíveis. Segredos ficam em vault.yml (ansible-vault).
domain: jairooferreira.online
lab_domain: "lab.{{ domain }}"
#acme_email: "voce@{{ domain }}"
acme_email: "j.oliveira2026@outlook.com.br"

# Fase de emissão de certificado: staging até validar, depois production
acme_ca: staging   # staging | production

ssh_port: 2222
admin_user: jairo

# Docker — pools definidos ANTES do primeiro container (evita colisão com LANs 172.x)
docker_address_pool_base: "10.201.0.0/16"
docker_address_pool_size: 24

# WireGuard
wg_interface: wg0
wg_port: 51820
wg_server_address: "10.100.0.1/24"
wg_network: "10.100.0.0/24"

# Serviços privados (só alcançáveis via wg0)
private_services:
  - { name: traefik,    host: "traefik.{{ lab_domain }}",    port: 8080 }
  - { name: grafana,    host: "grafana.{{ lab_domain }}",    port: 3000 }
  - { name: prometheus, host: "prometheus.{{ lab_domain }}", port: 9090 }

# App pública
app_host: "app.{{ domain }}"

# Backup
restic_repo: "b2:vps-platform-backup-jairo:/"
restic_keep_daily: 7
restic_keep_weekly: 4
restic_keep_monthly: 6

# Peers do WireGuard — chave publica pertence ao cliente, nao ao servidor
wg_peers:
  - name: notebook-jairo
    public_key: "DdXHly4j4fmi0S65O00Azey3g+FI992nVI3S22wf6z0="
    allowed_ips: 10.100.0.2/32

stack_dir: "/home/{{ admin_user }}/stacks"
